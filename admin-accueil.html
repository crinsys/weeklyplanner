<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Page d'accueil</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            background: #000000;
            color: white;
            padding: 20px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #cccccc;
            font-size: 0.9em;
        }

        .section {
            background: white;
            padding: 30px;
            margin-bottom: 20px;
            border: 2px solid #000000;
        }

        .section-title {
            font-size: 1.5em;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #000000;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #000000;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        textarea:focus {
            outline: none;
            border-color: #000000;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        .btn {
            padding: 12px 24px;
            border: 2px solid #000000;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.2s;
            background: #000000;
            color: white;
            margin-right: 10px;
        }

        .btn:hover {
            background: #333333;
        }

        .btn-secondary {
            background: white;
            color: #000000;
        }

        .btn-secondary:hover {
            background: #f5f5f5;
        }

        .help-text {
            font-size: 0.9em;
            color: #666666;
            margin-top: 5px;
            font-style: italic;
        }

        .success-message {
            background: #dcfce7;
            border: 2px solid #22c55e;
            padding: 15px;
            margin-bottom: 20px;
            color: #166534;
            font-weight: 500;
            display: none;
        }

        .error-message {
            background: #fee2e2;
            border: 2px solid #dc2626;
            padding: 15px;
            margin-bottom: 20px;
            color: #991b1b;
            font-weight: 500;
            display: none;
        }

        .upload-zone {
            border: 2px dashed #e0e0e0;
            padding: 20px;
            text-align: center;
            background: #fafafa;
            cursor: pointer;
            transition: all 0.2s;
        }

        .upload-zone:hover {
            border-color: #000000;
            background: #f5f5f5;
        }

        .upload-info {
            margin-top: 10px;
            font-size: 0.9em;
            color: #666666;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🛠️ Admin - Page d'accueil</h1>
            <div class="subtitle">Gestion de la permanence et du prochain RDV</div>
        </header>

        <div id="success-msg" class="success-message"></div>
        <div id="error-msg" class="error-message"></div>

        <!-- SECTION PERMANENCE -->
        <div class="section">
            <div class="section-title">Prochaine permanence</div>
            
            <div class="form-group">
                <label>Date</label>
                <input type="text" id="perm-date" placeholder="Ex: Lundi 02 Mars 2026">
            </div>

            <div class="form-group">
                <label>Titre de la permanence</label>
                <input type="text" id="perm-titre" placeholder="Ex: Permanence syndicale Hôtellerie Café Restauration">
            </div>

            <div class="form-group">
                <label>Horaires</label>
                <input type="text" id="perm-horaires" placeholder="Ex: 15:00 - 17:00">
            </div>

            <div class="form-group">
                <label>Lieu</label>
                <input type="text" id="perm-lieu" placeholder="Ex: UL CGT du 19ème | 1 rue de Nantes 75019">
            </div>
        </div>

        <!-- SECTION PROCHAIN RDV -->
        <div class="section">
            <div class="section-title">Prochain rendez-vous</div>

            <div class="form-group">
                <label>Date</label>
                <input type="text" id="rdv-date" placeholder="Ex: Dimanche 01 Mars 2026">
            </div>

            <div class="form-group">
                <label>Titre de l'événement</label>
                <input type="text" id="rdv-titre" placeholder="Ex: Apéro de la resto III">
            </div>

            <div class="form-group">
                <label>Heure et lieu</label>
                <input type="text" id="rdv-lieu" placeholder="Ex: 17:00 — ▸ TDTF - 43 rue Cavendish, Paris 19">
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="rdv-description" placeholder="Description de l'événement..."></textarea>
            </div>

            <div class="actions">
                <button class="btn" onclick="saveData()">💾 Enregistrer</button>
            </div>
        </div>
    </div>

    <script>
        // ⚙️ CONFIGURATION
        const CONFIG = {
            binId: '69a63387d0ea881f40e8ee99',
            apiKey: '$2a$10$my3e9Iq89J.e6ZbnhnWIwOwVd9ISyw7zmnOmVlKE672q14u4u6np2'
        };

        // Charger les données actuelles au démarrage
        window.addEventListener('load', loadCurrentData);

        async function loadCurrentData() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.binId}/latest`, {
                    headers: {
                        'X-Master-Key': CONFIG.apiKey
                    }
                });

                if (response.ok) {
                    const result = await response.json();
                    const data = result.record;
                    
                    // Pré-remplir les champs permanence
                    if (data.permanence) {
                        document.getElementById('perm-date').value = data.permanence.date || '';
                        document.getElementById('perm-titre').value = data.permanence.titre || '';
                        document.getElementById('perm-horaires').value = data.permanence.horaires || '';
                        document.getElementById('perm-lieu').value = data.permanence.lieu || '';
                    }
                    
                    // Pré-remplir les champs RDV
                    if (data.rdv) {
                        document.getElementById('rdv-date').value = data.rdv.date || '';
                        document.getElementById('rdv-titre').value = data.rdv.titre || '';
                        document.getElementById('rdv-lieu').value = data.rdv.lieu || '';
                        document.getElementById('rdv-description').value = data.rdv.description || '';
                    }
                }
            } catch (error) {
                console.log('Pas de données existantes, formulaire vide');
            }
        }

        async function saveData() {
            const data = {
                permanence: {
                    date: document.getElementById('perm-date').value,
                    titre: document.getElementById('perm-titre').value,
                    horaires: document.getElementById('perm-horaires').value,
                    lieu: document.getElementById('perm-lieu').value
                },
                rdv: {
                    date: document.getElementById('rdv-date').value,
                    titre: document.getElementById('rdv-titre').value,
                    lieu: document.getElementById('rdv-lieu').value,
                    description: document.getElementById('rdv-description').value,
                    image: 'event.png' // Toujours event.png
                }
            };

            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${CONFIG.binId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': CONFIG.apiKey
                    },
                    body: JSON.stringify(data)
                });

                if (response.ok) {
                    showSuccess('✅ Données enregistrées avec succès ! Rafraîchissez la page d\'accueil pour voir les changements.');
                } else {
                    throw new Error('Erreur lors de l\'enregistrement');
                }
            } catch (error) {
                showError('❌ Erreur : ' + error.message + ' - Vérifiez votre Bin ID et API Key dans le code');
                console.error('Error:', error);
            }
        }

        function showSuccess(message) {
            const successMsg = document.getElementById('success-msg');
            successMsg.textContent = message;
            successMsg.style.display = 'block';
            document.getElementById('error-msg').style.display = 'none';
            
            setTimeout(() => {
                successMsg.style.display = 'none';
            }, 8000);
        }

        function showError(message) {
            const errorMsg = document.getElementById('error-msg');
            errorMsg.textContent = message;
            errorMsg.style.display = 'block';
            document.getElementById('success-msg').style.display = 'none';
        }
    </script>
</body>
</html>
