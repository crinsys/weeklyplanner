<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Programme des Mobilisations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #ffffff;
            min-height: 100vh;
            padding: 20px;
            color: #000000;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 0;
            background: #f5f5f5;
            padding: 30px 20px 20px 20px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            color: #000000;
            font-weight: 600;
        }

        header p {
            color: #666666;
            font-size: 1em;
        }

        .admin-badge {
            display: inline-block;
            background: #000000;
            color: white;
            padding: 5px 15px;
            font-size: 0.9em;
            margin-top: 10px;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666666;
            font-size: 1.2em;
        }

        .week-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
            background: #f5f5f5;
            padding: 20px;
        }

        .week-nav button {
            background: white;
            border: 2px solid #000000;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            color: #000000;
            transition: all 0.2s;
        }

        .week-nav button:hover {
            background: #000000;
            color: #ffffff;
        }

        .week-info {
            color: #000000;
            font-size: 1.2em;
            font-weight: 600;
        }

        .calendar-grid {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .day-column {
            background: white;
            padding: 15px;
            border: 2px solid #000000;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            transition: all 0.3s ease;
        }

        .day-column.has-events {
            flex: 1.3;
            min-width: 200px;
        }

        .day-column.empty {
            flex: 0.7;
            min-width: 130px;
        }

        .day-header {
            text-align: center;
            padding: 10px;
            background: #000000;
            color: #ffffff;
            margin-bottom: 15px;
        }

        .day-name {
            font-size: 1.2em;
            font-weight: 600;
            color: #ffffff;
        }

        .day-date {
            font-size: 0.9em;
            color: #cccccc;
        }

        .events-list {
            flex: 1;
            overflow-y: auto;
        }

        .event-card {
            background: #f5f5f5;
            border-left: 4px solid #000000;
            padding: 12px;
            padding-right: 65px;
            margin-bottom: 10px;
            position: relative;
            transition: all 0.2s;
            cursor: pointer;
        }

        .event-card:hover {
            background: #e8e8e8;
            transform: translateX(3px);
        }

        .event-time {
            font-weight: 600;
            color: #000000;
            font-size: 0.9em;
            margin-bottom: 5px;
        }

        .event-title {
            font-weight: 600;
            margin-bottom: 5px;
            color: #000000;
        }

        .event-location {
            font-size: 0.85em;
            color: #666666;
            margin-bottom: 5px;
        }

        .event-description {
            font-size: 0.85em;
            color: #666666;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            line-height: 1.4em;
            max-height: 2.8em;
        }

        .delete-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            background: #000000;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-weight: bold;
        }

        .delete-btn:hover {
            background: #333333;
        }

        .edit-btn {
            position: absolute;
            top: 8px;
            right: 38px;
            background: #666666;
            color: white;
            border: none;
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            font-weight: bold;
        }

        .edit-btn:hover {
            background: #444444;
        }

        .add-event-btn {
            width: 100%;
            padding: 10px;
            background: #000000;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 1em;
            margin-top: 10px;
            transition: all 0.2s;
            font-weight: 500;
        }

        .add-event-btn:hover {
            background: #333333;
        }

        .event-tooltip {
            display: none;
            position: fixed;
            background: white;
            border: 2px solid #000000;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            z-index: 1000;
            max-width: 400px;
            min-width: 300px;
            pointer-events: none;
        }

        .event-tooltip.active {
            display: block;
        }

        .tooltip-time {
            font-weight: 600;
            color: #000000;
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .tooltip-title {
            font-weight: 600;
            font-size: 1.2em;
            margin-bottom: 10px;
            color: #000000;
        }

        .tooltip-location {
            font-size: 1em;
            color: #666666;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .tooltip-description {
            font-size: 1em;
            color: #333333;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 2px solid #000000;
        }

        .modal-header {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #000000;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #000000;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #cccccc;
            font-size: 1em;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #000000;
        }

        .category-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 8px;
        }

        .category-option {
            display: flex;
            align-items: center;
            padding: 10px;
            border: 2px solid #cccccc;
            cursor: pointer;
            transition: all 0.2s;
            background: white;
        }

        .category-option:hover {
            border-color: #000000;
        }

        .category-option input[type="radio"] {
            display: none;
        }

        .category-option input[type="radio"]:checked + .category-content {
            font-weight: 600;
        }

        .category-option.selected {
            border-color: #000000;
            background: #f5f5f5;
        }

        .category-content {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .category-color-preview {
            width: 4px;
            height: 30px;
            flex-shrink: 0;
        }

        .category-label {
            font-size: 0.95em;
            color: #000000;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
            padding: 12px;
            border: none;
            cursor: pointer;
            font-size: 1em;
            font-weight: 500;
            transition: all 0.2s;
        }

        .btn-submit {
            background: #000000;
            color: white;
        }

        .btn-submit:hover {
            background: #333333;
        }

        .btn-cancel {
            background: #cccccc;
            color: #000000;
        }

        .btn-cancel:hover {
            background: #b3b3b3;
        }

        @media (max-width: 1200px) {
            .day-column.has-events {
                flex: 1.2;
                min-width: 180px;
            }

            .day-column.empty {
                flex: 0.8;
                min-width: 110px;
            }
        }

        @media (max-width: 900px) {
            .calendar-grid {
                flex-direction: column;
            }

            .day-column.has-events,
            .day-column.empty {
                flex: 1;
                width: 100%;
                min-width: auto;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .week-nav {
                flex-direction: column;
                gap: 10px;
            }

            .week-nav button {
                width: 100%;
            }

            .event-tooltip {
                max-width: calc(100vw - 40px);
                min-width: auto;
            }

            .category-options {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .day-column {
                min-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Programme des Mobilisations</h1>
            <p>Interface d'administration</p>
            <span class="admin-badge">MODE ÉDITION</span>
        </header>

        <div class="loading" id="loading">Chargement des événements...</div>

        <div id="mainContent" style="display: none;">
            <div class="week-nav">
                <button onclick="changeWeek(-1)">← Semaine précédente</button>
                <div class="week-info" id="weekInfo"></div>
                <button onclick="changeWeek(1)">Semaine suivante →</button>
            </div>

            <div class="calendar-grid" id="calendar"></div>
        </div>
    </div>

    <div class="event-tooltip" id="eventTooltip"></div>

    <div class="modal" id="eventModal">
        <div class="modal-content">
            <h2 class="modal-header" id="modalTitle">Ajouter un événement</h2>
            <form id="eventForm">
                <input type="hidden" id="editDateKey">
                <input type="hidden" id="editIndex">
                
                <div class="form-group">
                    <label>Catégorie *</label>
                    <div class="category-options" id="categoryOptions"></div>
                </div>

                <div class="form-group">
                    <label for="eventTime">Heure *</label>
                    <input type="time" id="eventTime" required>
                </div>
                <div class="form-group">
                    <label for="eventTitle">Titre *</label>
                    <input type="text" id="eventTitle" required placeholder="Ex: Manifestation nationale">
                </div>
                <div class="form-group">
                    <label for="eventLocation">Lieu</label>
                    <input type="text" id="eventLocation" placeholder="Ex: Place de la République">
                </div>
                <div class="form-group">
                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" placeholder="Détails de l'événement..."></textarea>
                </div>
                <div class="modal-buttons">
                    <button type="submit" class="btn-submit" id="submitBtn">Ajouter</button>
                    <button type="button" class="btn-cancel" onclick="closeModal()">Annuler</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const API_KEY = '$2a$10$my3e9Iq89J.e6ZbnhnWIwOwVd9ISyw7zmnOmVlKE672q14u4u6np2';
        const BIN_ID = '676093d9acd3cb34a8b8ae13';
        
        let currentWeekOffset = 0;
        let currentDayIndex = null;
        let events = {};
        let isEditingEvent = false;

        const categories = [
            { id: 'manifestation', name: 'Manifestation', color: '#FFB5BA' },
            { id: 'reunion', name: 'Réunion', color: '#B5D5FF' },
            { id: 'action', name: 'Action', color: '#B5FFB5' },
            { id: 'formation', name: 'Formation', color: '#FFE5B5' },
            { id: 'ag', name: 'Assemblée Générale', color: '#E5B5FF' },
            { id: 'evenement', name: 'Événement', color: '#FFD5E5' }
        ];

        const daysOfWeek = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];

        async function loadEvents() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: {
                        'X-Master-Key': API_KEY
                    }
                });
                const data = await response.json();
                events = data.record || {};
                document.getElementById('loading').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                renderCalendar();
            } catch (error) {
                console.error('Erreur chargement:', error);
                document.getElementById('loading').textContent = 'Erreur de chargement. Rechargez la page.';
            }
        }

        async function saveEvents() {
            try {
                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify(events)
                });
            } catch (error) {
                console.error('Erreur sauvegarde:', error);
                alert('Erreur lors de la sauvegarde. Vérifiez votre connexion.');
            }
        }

        function initCategorySelector() {
            const container = document.getElementById('categoryOptions');
            container.innerHTML = '';
            
            categories.forEach(cat => {
                const option = document.createElement('label');
                option.className = 'category-option';
                option.innerHTML = `
                    <input type="radio" name="category" value="${cat.id}" required>
                    <div class="category-content">
                        <div class="category-color-preview" style="background-color: ${cat.color}"></div>
                        <span class="category-label">${cat.name}</span>
                    </div>
                `;
                
                option.addEventListener('click', function() {
                    document.querySelectorAll('.category-option').forEach(opt => {
                        opt.classList.remove('selected');
                    });
                    this.classList.add('selected');
                    this.querySelector('input').checked = true;
                });
                
                container.appendChild(option);
            });
        }

        function getCategoryColor(categoryId) {
            const category = categories.find(cat => cat.id === categoryId);
            return category ? category.color : '#000000';
        }

        function getWeekDates(offset) {
            const today = new Date();
            const currentDay = today.getDay();
            const monday = new Date(today);
            monday.setDate(today.getDate() - (currentDay === 0 ? 6 : currentDay - 1) + (offset * 7));
            
            const dates = [];
            for (let i = 0; i < 7; i++) {
                const date = new Date(monday);
                date.setDate(monday.getDate() + i);
                dates.push(date);
            }
            return dates;
        }

        function formatDate(date) {
            return date.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
        }

        function getDateKey(date) {
            return date.toISOString().split('T')[0];
        }

        function renderCalendar() {
            const dates = getWeekDates(currentWeekOffset);
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';

            const firstDate = dates[0];
            const lastDate = dates[6];
            document.getElementById('weekInfo').textContent = 
                `Semaine du ${formatDate(firstDate)} au ${formatDate(lastDate)}`;

            dates.forEach((date, index) => {
                const dateKey = getDateKey(date);
                const dayEvents = events[dateKey] || [];
                const hasEvents = dayEvents.length > 0;

                const dayColumn = document.createElement('div');
                dayColumn.className = `day-column ${hasEvents ? 'has-events' : 'empty'}`;
                dayColumn.innerHTML = `
                    <div class="day-header">
                        <div class="day-name">${daysOfWeek[index]}</div>
                        <div class="day-date">${formatDate(date)}</div>
                    </div>
                    <div class="events-list" id="events-${dateKey}"></div>
                    <button class="add-event-btn" onclick="openModal(${index})">+ Ajouter</button>
                `;
                calendar.appendChild(dayColumn);

                renderEvents(dateKey);
            });
        }

        function renderEvents(dateKey) {
            const eventsList = document.getElementById(`events-${dateKey}`);
            if (!eventsList) return;

            const dayEvents = events[dateKey] || [];
            eventsList.innerHTML = '';

            dayEvents.sort((a, b) => a.time.localeCompare(b.time));

            dayEvents.forEach((event, index) => {
                const borderColor = event.category ? getCategoryColor(event.category) : '#000000';
                const eventCard = document.createElement('div');
                eventCard.className = 'event-card';
                eventCard.style.borderLeftColor = borderColor;
                eventCard.innerHTML = `
                    <button class="edit-btn" onclick="editEvent('${dateKey}', ${index}); event.stopPropagation();">✎</button>
                    <button class="delete-btn" onclick="deleteEvent('${dateKey}', ${index}); event.stopPropagation();">×</button>
                    <div class="event-time">${event.time}</div>
                    <div class="event-title">${event.title}</div>
                    ${event.location ? `<div class="event-location">📍 ${event.location}</div>` : ''}
                    ${event.description ? `<div class="event-description">${event.description}</div>` : ''}
                `;
                
                eventCard.addEventListener('mouseenter', (e) => showTooltip(e, event));
                eventCard.addEventListener('mouseleave', hideTooltip);
                eventCard.addEventListener('mousemove', updateTooltipPosition);
                
                eventsList.appendChild(eventCard);
            });

            const dayColumn = eventsList.closest('.day-column');
            if (dayColumn) {
                if (dayEvents.length > 0) {
                    dayColumn.classList.add('has-events');
                    dayColumn.classList.remove('empty');
                } else {
                    dayColumn.classList.add('empty');
                    dayColumn.classList.remove('has-events');
                }
            }
        }

        function showTooltip(e, event) {
            const tooltip = document.getElementById('eventTooltip');
            tooltip.innerHTML = `
                <div class="tooltip-time">🕐 ${event.time}</div>
                <div class="tooltip-title">${event.title}</div>
                ${event.location ? `<div class="tooltip-location">📍 ${event.location}</div>` : ''}
                ${event.description ? `<div class="tooltip-description">${event.description}</div>` : ''}
            `;
            tooltip.classList.add('active');
            tooltip.style.pointerEvents = 'none';
            updateTooltipPosition(e);
        }

        function hideTooltip() {
            const tooltip = document.getElementById('eventTooltip');
            tooltip.classList.remove('active');
            tooltip.style.display = 'none';
        }

        function updateTooltipPosition(e) {
            const tooltip = document.getElementById('eventTooltip');
            if (!tooltip.classList.contains('active')) return;

            tooltip.style.visibility = 'hidden';
            tooltip.style.display = 'block';
            
            const tooltipRect = tooltip.getBoundingClientRect();
            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;
            
            tooltip.style.visibility = 'visible';

            let finalX = e.clientX + 15;
            let finalY = e.clientY + 15;

            if (finalX + tooltipRect.width > viewportWidth - 20) {
                finalX = viewportWidth - tooltipRect.width - 20;
            }
            
            if (finalX < 20) {
                finalX = 20;
            }

            if (finalY + tooltipRect.height > viewportHeight - 20) {
                finalY = viewportHeight - tooltipRect.height - 20;
            }
            
            if (finalY < 20) {
                finalY = 20;
            }

            tooltip.style.left = finalX + 'px';
            tooltip.style.top = finalY + 'px';
        }

        function openModal(dayIndex) {
            currentDayIndex = dayIndex;
            isEditingEvent = false;
            document.getElementById('modalTitle').textContent = 'Ajouter un événement';
            document.getElementById('submitBtn').textContent = 'Ajouter';
            document.getElementById('eventModal').classList.add('active');
            document.getElementById('eventForm').reset();
            document.getElementById('editDateKey').value = '';
            document.getElementById('editIndex').value = '';
            
            document.querySelectorAll('.category-option').forEach(opt => {
                opt.classList.remove('selected');
            });
        }

        function editEvent(dateKey, index) {
            isEditingEvent = true;
            const event = events[dateKey][index];
            
            document.getElementById('modalTitle').textContent = 'Modifier l\'événement';
            document.getElementById('submitBtn').textContent = 'Modifier';
            document.getElementById('editDateKey').value = dateKey;
            document.getElementById('editIndex').value = index;
            
            document.getElementById('eventTime').value = event.time;
            document.getElementById('eventTitle').value = event.title;
            document.getElementById('eventLocation').value = event.location || '';
            document.getElementById('eventDescription').value = event.description || '';
            
            document.querySelectorAll('.category-option').forEach(opt => {
                opt.classList.remove('selected');
                const radio = opt.querySelector('input');
                if (radio.value === event.category) {
                    opt.classList.add('selected');
                    radio.checked = true;
                }
            });
            
            document.getElementById('eventModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('eventModal').classList.remove('active');
            currentDayIndex = null;
            isEditingEvent = false;
        }

        function changeWeek(offset) {
            currentWeekOffset += offset;
            hideTooltip();
            renderCalendar();
        }

        async function deleteEvent(dateKey, index) {
            if (confirm('Êtes-vous sûr de vouloir supprimer cet événement ?')) {
                events[dateKey].splice(index, 1);
                if (events[dateKey].length === 0) {
                    delete events[dateKey];
                }
                await saveEvents();
                renderEvents(dateKey);
            }
        }

        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const selectedCategory = document.querySelector('input[name="category"]:checked');
            if (!selectedCategory) {
                alert('Veuillez sélectionner une catégorie');
                return;
            }
            
            if (isEditingEvent) {
                const dateKey = document.getElementById('editDateKey').value;
                const index = parseInt(document.getElementById('editIndex').value);
                
                events[dateKey][index] = {
                    category: selectedCategory.value,
                    time: document.getElementById('eventTime').value,
                    title: document.getElementById('eventTitle').value,
                    location: document.getElementById('eventLocation').value,
                    description: document.getElementById('eventDescription').value
                };
                
                await saveEvents();
                renderEvents(dateKey);
            } else {
                const dates = getWeekDates(currentWeekOffset);
                const selectedDate = dates[currentDayIndex];
                const dateKey = getDateKey(selectedDate);

                const newEvent = {
                    category: selectedCategory.value,
                    time: document.getElementById('eventTime').value,
                    title: document.getElementById('eventTitle').value,
                    location: document.getElementById('eventLocation').value,
                    description: document.getElementById('eventDescription').value
                };

                if (!events[dateKey]) {
                    events[dateKey] = [];
                }
                events[dateKey].push(newEvent);
                
                await saveEvents();
                renderEvents(dateKey);
            }
            
            closeModal();
        });

        document.getElementById('eventModal').addEventListener('click', (e) => {
            if (e.target.id === 'eventModal') {
                closeModal();
            }
        });

        initCategorySelector();
        loadEvents();
    </script>
</body>
</html>
