<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Collectif MEP</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        header {
            background: #000000;
            color: white;
            padding: 30px;
            margin-bottom: 30px;
            text-align: center;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cccccc;
            font-size: 1em;
        }

        .admin-grid {
            display: grid;
            gap: 20px;
        }

        .admin-btn {
            background: white;
            border: 3px solid #000000;
            padding: 40px;
            text-align: center;
            text-decoration: none;
            color: #000000;
            transition: all 0.3s;
            display: block;
        }

        .admin-btn:hover {
            background: #000000;
            color: white;
            transform: translateY(-3px);
        }

        .admin-btn.disabled {
            background: #f5f5f5;
            border-color: #cccccc;
            color: #999999;
            cursor: not-allowed;
        }

        .admin-btn.disabled:hover {
            background: #f5f5f5;
            color: #999999;
            transform: none;
        }

        .btn-title {
            font-size: 1.8em;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .btn-description {
            font-size: 1em;
            opacity: 0.7;
        }

        .coming-soon {
            font-size: 0.9em;
            font-style: italic;
            color: #999999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Administration</h1>
            <div class="subtitle">Collectif Mise En Place</div>
        </header>

        <div class="admin-grid">
            <a href="https://crinsys.github.io/weeklyplanner/admin-accueil.html" class="admin-btn">
                <div class="btn-title">Modifier page d'accueil</div>
                <div class="btn-description">Gérer la permanence et le prochain RDV</div>
            </a>

            <a href="https://crinsys.github.io/weeklyplanner/agenda.html" class="admin-btn">
                <div class="btn-title">Modifier agenda</div>
                <div class="btn-description">Ajouter et modifier les événements du calendrier</div>
            </a>

            <div class="admin-btn disabled">
                <div class="btn-title">Modifier outils</div>
                <div class="btn-description">Gérer les guides et ressources</div>
                <div class="coming-soon">À venir</div>
            </div>
        </div>
    </div>
</body>
</html>
